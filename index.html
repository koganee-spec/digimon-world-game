<style>

</style></head><body><div id="game"></div><div class="hud">
<div class="top"><div class="card stats"><div class="title">デジタルワールド：育成の旅 <span class="small">3D v0.2</span></div><div class="name" id="monName">コロモン</div><div class="small" id="stage">幼年期</div>
<div class="line"><span>HP</span><b id="hpT">30/30</b></div><div class="bar"><div id="hpB" class="fill"></div></div><div class="line"><span>空腹</span><b id="foodT">30%</b></div><div class="bar"><div id="foodB" class="fill food"></div></div><div class="line"><span>疲労</span><b id="fatT">10%</b></div><div class="bar"><div id="fatB" class="fill fat"></div></div><div class="line"><span>力 <b id="strT">8</b>　賢さ <b id="wisT">5</b></span><span>しつけ <b id="disT">50</b></span></div></div>
<div class="card right"><div id="clock">1日目 08:00</div><div class="small" id="area">はじまりの草原</div><button style="margin-top:6px" onclick="openMenu()">メニュー ☰</button></div></div>
<div class="bottom"><div class="pad"><button class="blank">·</button><button data-m="0,-1">▲</button><button class="blank">·</button><button data-m="-1,0">◀</button><button data-m="0,1">▼</button><button data-m="1,0">▶</button></div><div class="actions"><button onclick="act('food')">🍖 ごはん</button><button onclick="act('train')">🏋️ トレーニング</button><button onclick="act('rest')">💤 休息</button><button onclick="act('praise')">💛 ほめる</button><button onclick="act('battle')">⚔️ バトル</button><button onclick="interact()">💬 調べる</button></div></div></div>
<div id="dialog" class="dialog"></div><div id="toast"></div><div id="menu"><div class="modal"><h2>育成メニュー</h2><p id="info">育成と状態を確認しよう。</p><div class="grid"><button onclick="act('food')">ごはん</button><button onclick="act('train')">トレーニング</button><button onclick="act('rest')">休息</button><button onclick="act('praise')">ほめる</button><button onclick="act('scold')">叱る</button><button onclick="act('battle')">模擬バトル</button><button onclick="save()">セーブ</button><button onclick="load()">ロード</button><button onclick="evoInfo()">進化条件</button><button onclick="closeMenu()">冒険に戻る</button></div><p>同じブラウザにセーブされます。CDN読み込みのためネット接続が必要です。</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const host=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc8d1);scene.fog=new THREE.Fog(0x9dc8d1,25,65);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(5,8,11);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x526348,2));const sun=new THREE.DirectionalLight(0xffefce,2.5);sun.position.set(-7,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}),green=material(0x527b5a),green2=material(0x648c63),stone=material(0x7d8e88),darkstone=material(0x52645f),wood=material(0x79583c);
const world=new THREE.Group();scene.add(world);let floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),green);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;world.add(floor);
let road=new THREE.Mesh(new THREE.PlaneGeometry(7,38),material(0xc5ad7e));road.rotation.x=-Math.PI/2;road.position.set(0,.015,2);world.add(road);
function box(p,w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);world.add(g);box(g,.42,1.25,.42,wood,0,.62,0);let a=new THREE.Mesh(new THREE.IcosahedronGeometry(.95*s,0),material(0x2f6248));a.position.y=1.75*s;a.castShadow=true;g.add(a);let b=new THREE.Mesh(new THREE.IcosahedronGeometry(.61*s,0),material(0x477d55));b.position.set(.2,2.18*s,.1);g.add(b)}
[[-8,-8,1.2],[8,-9,1.15],[-10,2,1],[10,4,1.1],[-7,10,.9],[8,11,1.1],[-13,-2,1.3],[13,-3,1.3]].forEach(a=>tree(...a));
for(let i=0;i<50;i++){let x=(i*37%27)-13,z=(i*19%28)-14;if(Math.abs(x)<4)continue;let o=new THREE.Mesh(new THREE.IcosahedronGeometry(.12+(i%3)*.04,0),i%2?green2:green);o.position.set(x,.1,z);o.scale.y=.3;world.add(o)}
const ruin=new THREE.Group();ruin.position.set(-5,0,-8);world.add(ruin);box(ruin,1,3,1,stone,-1,1.5,0);box(ruin,1,3,1,stone,1,1.5,0);box(ruin,3.2,.7,1.2,stone,0,3,0);box(ruin,.7,2,.4,darkstone,0,1,.7);
box(world,1.7,1.25,.22,wood,4,.65,-5);box(world,1.3,.85,.08,material(0xd6c28a),4,.68,-5.13);
for(let i=0;i<8;i++){let r=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+(i%2)*.2,0),i%2?stone:darkstone);r.position.set(-3+i*.9,.3,7+Math.sin(i)*.4);world.add(r)}
const player=new THREE.Group();world.add(player);box(player,.5,.72,.32,material(0x385d8a),0,.78,0);box(player,.36,.3,.33,material(0xd9a87c),0,1.34,0);box(player,.48,.12,.4,material(0x273648),0,1.55,0);box(player,.14,.48,.17,material(0x273648),-.15,.24,0);box(player,.14,.48,.17,material(0x273648),.15,.24,0);
const mon=new THREE.Group();world.add(mon);const bodyMat=material(0xe8ad4b),body=new THREE.Mesh(new THREE.IcosahedronGeometry(.63,1),bodyMat);body.scale.set(1,.9,1.12);body.position.y=.68;body.castShadow=true;mon.add(body);const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.48,1),bodyMat);head.position.set(0,1.22,.42);head.castShadow=true;mon.add(head);const md=material(0xb87736),cream=material(0xffe5a4),eyeMat=material(0x17222c);
for(const s of [-1,1]){let ear=new THREE.Mesh(new THREE.ConeGeometry(.19,.53,5),md);ear.position.set(s*.3,1.64,.35);ear.rotation.z=s*-.38;mon.add(ear);let leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.42,5),md);leg.position.set(s*.3,.25,.05);mon.add(leg);let eye=new THREE.Mesh(new THREE.SphereGeometry(.075,6,5),eyeMat);eye.position.set(s*.19,1.3,.81);mon.add(eye)}
let belly=new THREE.Mesh(new THREE.IcosahedronGeometry(.31,1),cream);belly.scale.set(.9,.75,.4);belly.position.set(0,.65,.49);mon.add(belly);let tail=new THREE.Mesh(new THREE.ConeGeometry(.15,.7,5),md);tail.position.set(0,.65,-.75);tail.rotation.x=-Math.PI/2.8;mon.add(tail);
const state={x:0,z:2,day:1,hour:8,hp:30,maxHp:30,food:30,fatigue:10,str:8,wis:5,discipline:50,happy:60,age:0,stage:0,wins:0};
const names=['コロモン','ツノモン','ガルルガ','モリリモン'],stages=['幼年期','成長期','成熟期・力型','成熟期・賢さ型'];let last=performance.now(),bob=0,timer;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(t){let d=document.querySelector('#dialog');d.innerHTML=t;d.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>d.classList.remove('show'),2800)}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(timer);timer=setTimeout(()=>e.style.display='none',1800)}
function evolve(){state.stage=state.str>=state.wis+4&&state.fatigue<70?2:3;state.maxHp=state.stage===2?58:50;state.hp=clamp(state.hp+14,0,state.maxHp);bodyMat.color.setHex(state.stage===2?0x9ba9bd:0x67c28b);body.scale.set(state.stage>=2?1.2:1,.9,state.stage>=2?1.35:1.12);head.scale.setScalar(state.stage>=2?1.16:1);toast('進化！ '+names[state.stage]);say('<strong>進化！</strong> '+names[state.stage]+'になった！')}
function tick(h=1){state.hour+=h;while(state.hour>=24){state.hour-=24;state.day++;state.age++;state.food=clamp(state.food+9,0,100);state.fatigue=clamp(state.fatigue+7,0,100);if(state.food>=90)state.hp=clamp(state.hp-2,0,state.maxHp);if(state.age>=2&&state.stage===0){state.stage=1;state.maxHp=38;state.hp=clamp(state.hp+8,0,state.maxHp);bodyMat.color.setHex(0xe0a34c);toast('成長期に進化！')}if(state.age>=5&&state.stage===1)evolve()}}
function hud(){document.querySelector('#monName').textContent=names[state.stage];document.querySelector('#stage').textContent=stages[state.stage];for(const [id,v] of [['hpT',`${Math.round(state.hp)}/${state.maxHp}`],['foodT',Math.round(state.food)+'%'],['fatT',Math.round(state.fatigue)+'%'],['strT',state.str],['wisT',state.wis],['disT',state.discipline]])document.getElementById(id).textContent=v;document.querySelector('#hpB').style.width=100*state.hp/state.maxHp+'%';document.querySelector('#foodB').style.width=state.food+'%';document.querySelector('#fatB').style.width=state.fatigue+'%';document.querySelector('#clock').textContent=state.day+'日目 '+String(state.hour).padStart(2,'0')+':00';document.querySelector('#info').textContent=`${names[state.stage]} / ${stages[state.stage]}。ごきげん ${state.happy}、成長日数 ${state.age}、勝利 ${state.wins}回。`}
function act(a){closeMenu();if(a==='food'){state.food=clamp(state.food-28,0,100);state.hp=clamp(state.hp+5,0,state.maxHp);state.happy=clamp(state.happy+8,0,100);say('おいしそうにごはんを食べた！')}if(a==='train'){if(state.fatigue>88){say('疲れすぎてトレーニングできない。休ませよう。');return}state.str+=2;state.wis++;state.fatigue=clamp(state.fatigue+19,0,100);state.food=clamp(state.food+12,0,100);state.hp=clamp(state.hp-2,1,state.maxHp);say('トレーニング成功！ 力と賢さが上がった。')}if(a==='rest'){state.fatigue=clamp(state.fatigue-38,0,100);state.hp=clamp(state.hp+10,0,state.maxHp);state.happy=clamp(state.happy+4,0,100);tick(3);say('ゆっくり休んで元気を取り戻した。')}if(a==='praise'){state.discipline=clamp(state.discipline+7,0,100);state.happy=clamp(state.happy+10,0,100);say('ほめられてうれしそうだ！')}if(a==='scold'){state.discipline=clamp(state.discipline-8,0,100);state.happy=clamp(state.happy-12,0,100);say('しょんぼりしている…。叱りすぎに注意。')}if(a==='battle'){if(state.fatigue>78||state.hp<8){say('疲れすぎて戦えない。休息しよう。');return}let p=state.str+Math.random()*9,e=12+state.stage*7+Math.random()*12;state.fatigue=clamp(state.fatigue+16,0,100);state.food=clamp(state.food+10,0,100);if(p>=e){state.wins++;state.str++;state.hp=clamp(state.hp-4,1,state.maxHp);state.happy=clamp(state.happy+6,0,100);say('<strong>勝利！</strong> 経験を積んで力が上がった。')}else{state.hp=clamp(state.hp-9,0,state.maxHp);state.happy=clamp(state.happy-7,0,100);say('惜しくも敗北…。鍛えて再挑戦しよう。')}}tick();hud()}
function move(dx,dz){state.x=clamp(state.x+dx*1.2,-14,14);state.z=clamp(state.z+dz*1.2,-15,15);player.position.set(state.x,0,state.z);player.rotation.y=Math.atan2(dx,dz);mon.position.set(state.x+.95,0,state.z+.25);mon.rotation.y=player.rotation.y;tick();if(Math.random()<.12)say('草むらで何かの気配がした…。');hud()}
function interact(){if(Math.abs(state.x+5)<3&&Math.abs(state.z+8)<3)say('苔むした遺跡だ。奥へ続く道はまだ見つからない。');else if(Math.abs(state.x-4)<2&&Math.abs(state.z+5)<2)say('看板：「よく食べ、よく休み、よく冒険しよう！」');else say('風が草原を通り抜ける。パートナーは周囲を見回している。')}
function openMenu(){document.querySelector('#menu').classList.add('show')}function closeMenu(){document.querySelector('#menu').classList.remove('show')}function save(){localStorage.setItem('dw3d-save',JSON.stringify(state));toast('セーブしました')}function load(){let s=localStorage.getItem('dw3d-save');if(!s){toast('セーブデータがありません');return}Object.assign(state,JSON.parse(s));player.position.set(state.x,0,state.z);mon.position.set(state.x+.95,0,state.z+.25);hud();closeMenu();toast('ロードしました')}function evoInfo(){say(state.stage>=2?'成熟期に進化済み。育成を続けよう。':`進化目安：成長5日。力${state.str} / 賢さ${state.wis} / 疲労${state.fatigue}%。力が高く疲労が低いと力型になりやすい。`)}
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...b.dataset.m.split(',').map(Number))}));addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0);if(e.key==='Escape')closeMenu()});document.querySelector('#menu').addEventListener('click',e=>{if(e.target.id==='menu')closeMenu()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
Object.assign(window,{act,openMenu,closeMenu,save,load,evoInfo,interact});
player.position.set(state.x,0,state.z);mon.position.set(state.x+.95,0,state.z+.25);hud();say('<strong>冒険の始まり！</strong> 矢印で移動し、育成メニューでパートナーを育てよう。');
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.05);last=t;bob+=dt*3;mon.position.y=.03+Math.sin(bob)*.05;mon.rotation.y+=dt*.12;camera.position.lerp(new THREE.Vector3(player.position.x+5,7.4,player.position.z+9),.055);camera.lookAt(player.position.x,1,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(loop);
